<script>
    // ඔයාගේ අලුත්ම Sheet ID එක මෙතන තියෙනවා
    const SHEET_ID = '1aFu6FDW6fOOeCtnGpWiBWwkinOFMCm38hyDOD5jdD3M'; 
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${1aFu6FDW6fOOeCtnGpWiBWwkinOFMCm38hyDOD5jdD3M}/pub?output=csv`;

    let products = [];
    let cart = [];

    async function fetchProducts() {
        try {
            const response = await fetch(CSV_URL);
            const data = await response.text();
            
            // CSV එක පේළි වලට වෙන් කිරීම
            const rows = data.split(/\r?\n/).slice(1); 

            products = rows.map(row => {
                // Quotes ඇතුලේ කොමා තිබුණත් අහුනොවන සේ වෙන් කිරීම
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (cols.length >= 4) {
                    return {
                        // Barcode එකේ අංක විදිහටම තියාගන්න String එකක් කරනවා
                        id: cols[0] ? cols[0].replace(/"/g, '').trim() : Math.random().toString(),
                        name: cols[1] ? cols[1].replace(/"/g, '').trim() : 'No Name',
                        mrp: cols[2] ? parseFloat(cols[2].replace(/"/g, '')) : 0,
                        sellingPrice: cols[3] ? parseFloat(cols[3].replace(/"/g, '')) : 0,
                        category: cols[4] ? cols[4].replace(/"/g, '').trim() : 'General'
                    };
                }
                return null;
            }).filter(p => p !== null && p.name !== "");

            setupCategories();
            document.getElementById('loading').style.display = 'none';
            loadProducts(products);
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('loading').innerHTML = "<b style='color:red;'>දත්ත ලබා ගැනීමට අපොහොසත් විය. කරුණාකර 'Publish to Web' කර ඇත්දැයි බලන්න.</b>";
        }
    }

    // ඉතිරි Functions (setupCategories, loadProducts, addToCart ආදිය) ඔයාගේ පරණ කෝඩ් එකේ විදිහටම තියන්න.
    // ...
</script>
